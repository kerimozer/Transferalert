<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Marka tonu — eski teal #116173 A2 turunda emekliye ayrıldı.
         TEK meta ve `media` KOŞULU YOK: `prefers-color-scheme`e çivilenseydi
         işletim sistemi açık modda ve kullanıcı "Koyu" seçmişken sayfa koyu,
         tarayıcı çubuğu marka teal'inde kalırdı — "ayarım uygulandı mı"
         ailesinden bir çelişki, yani tam bu turun konusu. Değeri seçim
         değiştikçe `temaUygula` günceller (paletten okur, hex kopyalamaz). -->
    <meta name="theme-color" content="#0F5D6B" />

    <!-- TEMA İLK BOYADAN ÖNCE DAMGALANIR (A6, 2026-09-12).
         React mount olana kadar beklenirse koyu temadaki kullanıcı bir kare
         BEYAZ görür; bu betik `<head>` ayrıştırılırken senkron koşar.
         Damganın tek tüketicisi `src/index.css` → `:root[data-theme="dark"]`;
         aynı kararı `src/lib/theme.js` elle seçimde tekrar uygular.

         A8 (2026-09-16): varsayılan artık SAATE göre ("auto", 21:00–07:00
         koyu). Bu betik `temaSemasi()`nin KOPYASIDIR ve kopya olduğu için
         kapıda GERÇEKTEN koşturulup sahte bir saatle o fonksiyonun sonucuyla
         karşılaştırılıyor — bu projede kopyalanan her kural er geç ayrıştı ve
         ayrıştığını kimse görmedi. Sınırı değiştiren tur BURAYI da
         değiştirmek zorunda; kapı unutulursa CI'ı kırar. -->
    <script>
      (function () {
        var h = new Date().getHours();
        var gece = h >= 21 || h < 7;   // lib/theme.js → GECE_BASI / GECE_SONU
        var sistem = function () {
          try { return window.matchMedia('(prefers-color-scheme: dark)').matches; }
          catch (e) { return false; }
        };
        var t = null;
        try {
          t = localStorage.getItem('app_theme');
        } catch (e) {
          // localStorage erişimi engellenmiş olabilir (site verisi kapalı
          // Chrome, bazı gömülü webview'lar). Bu, "kullanıcı açık tema
          // istiyor" demek DEĞİL: okunamayan tercih = tercih yok = varsayılan,
          // yani saate bak. Aksi hâlde gecenin ortasındaki kullanıcı her
          // yüklemede beyaz çakma yerdi.
        }
        var koyu = t === 'dark' || (t !== 'light' && (t === 'system' ? sistem() : gece));
        document.documentElement.setAttribute('data-theme', koyu ? 'dark' : 'light');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>TransferAlert</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
